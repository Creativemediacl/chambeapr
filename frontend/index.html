<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChambeaPR - Encuentra tu Tecnico</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:"Segoe UI",sans-serif;background:#f0f2f5;color:#1B2A4A;}header{background:linear-gradient(135deg,#1B2A4A,#2C3E6B);color:white;padding:20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 3px 10px rgba(0,0,0,0.3);}header h1{font-size:1.8em;color:#F5A623;}header p{color:#ccd6f6;font-size:0.9em;margin-top:5px;}.btn-register{background:#F5A623;color:#1B2A4A;border:none;padding:10px 20px;border-radius:25px;font-size:1em;font-weight:bold;cursor:pointer;margin-top:10px;}.btn-register:hover{background:#e09415;}.search-section{background:white;padding:20px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}  .search-section h2{color:#1B2A4A;margin-bottom:15px;font-size:1.1em;}.filters{display:flex;gap:10px;flex-wrap:wrap;}.filters select,.filters input{flex:1;padding:12px;border:2px solid #dde3f0;border-radius:10px;font-size:1em;color:#1B2A4A;min-width:150px;}.filters select:focus,.filters input:focus{border-color:#F5A623;outline:none;}.filters button{padding:12px 25px;background:#1B2A4A;color:white;border:none;border-radius:10px;font-size:1em;cursor:pointer;font-weight:bold;}.filters button:hover{background:#2C3E6B;}main{max-width:900px;margin:0 auto;padding:20px;}.workers-section h2{color:#1B2A4A;margin-bottom:15px;font-size:1.1em;}.worker-card{background:white;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(27,42,74,0.1);border-left:5px solid #F5A623;transition:transform 0.2s;}.worker-card:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(27,42,74,0.15);}.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:10px;}.worker-name{font-size:1.2em;font-weight:bold;color:#1B2A4A;}.verified-badge{background:#F5A623;color:#1B2A4A;font-size:0.75em;padding:3px 10px;border-radius:20px;font-weight:bold;}.worker-meta{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:10px;}.worker-meta span{color:#555;font-size:0.9em;}.profession-badge{background:#e8edf5;color:#1B2A4A;padding:4px 12px;border-radius:20px;font-size:0.85em;font-weight:bold;border:1px solid #ccd6f6;}.worker-desc{color:#444;font-size:0.95em;line-height:1.5;margin-bottom:15px;}.whatsapp-btn{background:#25D366;color:white;border:none;padding:12px 20px;border-radius:10px;font-size:1em;font-weight:bold;cursor:pointer;width:100%;transition:background 0.2s;}.whatsapp-btn:hover{background:#128C7E;}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:1000;}.modal.hidden{display:none;}.modal-content{background:white;border-radius:15px;padding:30px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;}.modal-content h2{color:#1B2A4A;margin-bottom:5px;}.modal-content p.subtitle{color:#666;font-size:0.9em;margin-bottom:20px;border-bottom:2px solid #F5A623;padding-bottom:10px;}.form-group{margin-bottom:15px;}.form-group label{display:block;color:#1B2A4A;font-weight:bold;font-size:0.9em;margin-bottom:5px;}.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid #dde3f0;border-radius:10px;font-size:1em;color:#1B2A4A;}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#F5A623;outline:none;}.btn-submit{width:100%;padding:14px;background:#F5A623;color:#1B2A4A;border:none;border-radius:10px;font-size:1.1em;cursor:pointer;font-weight:bold;margin-bottom:10px;}.btn-submit:hover{background:#e09415;}.btn-cancel{width:100%;padding:12px;background:#f0f2f5;color:#1B2A4A;border:2px solid #dde3f0;border-radius:10px;font-size:1em;cursor:pointer;}.success{color:#1B2A4A;background:#fff3cd;padding:12px;border-radius:8px;margin-top:10px;text-align:center;border:1px solid #F5A623;}.error{color:#c1121f;background:#ffe0e0;padding:12px;border-radius:8px;margin-top:10px;text-align:center;}footer{text-align:center;padding:30px 20px;color:#666;font-size:0.9em;background:#1B2A4A;color:#ccd6f6;margin-top:30px;}footer strong{color:#F5A623;}@media(max-width:600px){header h1{font-size:1.5em;}.worker-card{padding:15px;}.modal-content{padding:20px;}}</style></head><body><header><h1>🔨 ChambeaPR</h1><p>Tecnicos verificados en tu municipio</p><button class="btn-register" onclick="showRegister()">Registrate como Tecnico</button></header><div class="search-section"><div style="max-width:900px;margin:0 auto;"><h2>Busca un servicio en tu area</h2><div class="filters"><input type="text" id="search-input" placeholder="Buscar servicio (ej. Plomero, Electricista...)"><select id="filtro-municipio"><option value="">Todo Puerto Rico</option></select><button onclick="buscarTecnicos()">Buscar</button></div></div></div><main><div class="workers-section"><h2>Tecnicos Disponibles <span id="total-count" style="color:#F5A623;"></span></h2><div id="workers-list"></div></div></main><div id="register-modal" class="modal hidden"><div class="modal-content"><h2>Registrate como Tecnico</h2><p class="subtitle">90 dias GRATIS - luego $9.99/mes</p><div class="form-group"><label>Nombre Completo *</label><input type="text" id="reg-name" placeholder="Tu nombre completo" required></div><div class="form-group"><label>Email *</label><input type="email" id="reg-email" placeholder="tu@email.com" required></div><div class="form-group"><label>Numero de WhatsApp *</label><input type="text" id="reg-whatsapp" placeholder="17871234567" required></div><div class="form-group"><label>Municipio *</label><select id="reg-municipio"><option value="">Selecciona tu municipio</option></select></div><div class="form-group"><label>Tu Servicio Principal *</label><select id="reg-profesion"><option value="">Selecciona tu servicio</option></select></div><div class="form-group"><label>Describe tu experiencia</label><textarea id="reg-bio" placeholder="Cuéntanos sobre tu experiencia, años en el negocio, especialidades..." rows="3"></textarea></div><button class="btn-submit" onclick="registrarTecnico()">Registrarme Gratis</button><button class="btn-cancel" onclick="hideRegister()">Cancelar</button><p id="reg-message"></p></div></div><footer><p><strong>ChambeaPR</strong> - Conectando Puerto Rico 🇵🇷</p><p style="margin-top:5px;font-size:0.8em;">Hecho con orgullo en Puerto Rico</p></footer><script>const API="/api";async function init(){const r1=await fetch(API+"/municipios");const d1=await r1.json();["filtro-municipio","reg-municipio"].forEach(id=>{const sel=document.getElementById(id);d1.municipios.forEach(m=>{const opt=document.createElement("option");opt.value=m;opt.textContent=m;sel.appendChild(opt);});});const r2=await fetch(API+"/categorias");const d2=await r2.json();const sel=document.getElementById("reg-profesion");d2.categorias.forEach(c=>{const opt=document.createElement("option");opt.value=c;opt.textContent=c;sel.appendChild(opt);});buscarTecnicos();}async function buscarTecnicos(){const search=document.getElementById("search-input").value;const mun=document.getElementById("filtro-municipio").value;let url=API+"/workers?";if(mun)url+="municipality="+mun+"&";if(search)url+="profession="+encodeURIComponent(search);const res=await fetch(url);const workers=await res.json();const list=document.getElementById("workers-list");document.getElementById("total-count").textContent="("+workers.length+")";if(workers.length===0){list.innerHTML="<p style='text-align:center;padding:40px;color:#666'>No hay tecnicos en esta area todavia. <br><br><button class='btn-register' onclick='showRegister()'>Ser el primero</button></p>";return;}list.innerHTML=workers.map(w=>"<div class='worker-card'><div class='card-header'><div class='worker-name'>"+w.full_name+"</div>"+(w.is_verified?"<span class='verified-badge'>Verificado</span>":"")+"</div><div class='worker-meta'><span class='profession-badge'>"+w.profession+"</span><span>📍 "+w.municipality+"</span></div><p class='worker-desc'>"+( w.description||"")+"</p><button class='whatsapp-btn' onclick='contactar("+w.id+")'>💬 Contactar por WhatsApp</button></div>").join("");}async function contactar(id){const res=await fetch(API+"/workers/"+id+"/contact");const data=await res.json();window.open(data.whatsapp_url,"_blank");}function showRegister(){document.getElementById("register-modal").classList.remove("hidden");}function hideRegister(){document.getElementById("register-modal").classList.add("hidden");}async function registrarTecnico(){const full_name=document.getElementById("reg-name").value;const email=document.getElementById("reg-email").value;const whatsapp_number=document.getElementById("reg-whatsapp").value;const municipality=document.getElementById("reg-municipio").value;const profession=document.getElementById("reg-profesion").value;const description=document.getElementById("reg-bio").value;const msg=document.getElementById("reg-message");if(!full_name||!email||!whatsapp_number||!municipality||!profession){msg.textContent="Por favor completa todos los campos requeridos.";msg.className="error";return;}const res=await fetch(API+"/workers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({full_name,email,phone_number:whatsapp_number,whatsapp_number,municipality,profession,description})});if(res.ok){msg.textContent="Registro exitoso! Bienvenido a ChambeaPR!";msg.className="success";setTimeout(()=>{hideRegister();buscarTecnicos();},2000);}else{const err=await res.json();msg.textContent=err.detail||"Error al registrar.";msg.className="error";}}document.addEventListener("DOMContentLoaded",init);</script></body></html>
