<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChambeaPR - Encuentra Tecnicos en Puerto Rico</title><link rel="stylesheet" href="/static/css/style.css?v=2"></head><body><header><div class="header-content"><h1>ChambeaPR</h1><p class="subtitle">Encuentra tecnicos y servicios en Puerto Rico</p></div><div class="header-buttons"><button onclick="showRegister()" class="btn-register">Registrate como Tecnico</button></div></header><main><section class="search-section"><h2>Busca un Servicio</h2><div class="filters"><select id="filtro-municipio"><option value="">Todos los municipios</option></select><select id="filtro-categoria"><option value="">Todos los servicios</option></select><button onclick="buscarTecnicos()">Buscar</button></div></section><section class="workers-section"><h2>Tecnicos Disponibles <span id="total-count"></span></h2><div id="workers-list"></div></section><div id="register-modal" class="modal hidden"><div class="modal-content"><h2>Registrate como Tecnico</h2><div class="form-group"><input type="text" id="reg-name" placeholder="Tu nombre completo" required></div><div class="form-group"><input type="email" id="reg-email" placeholder="Tu email (para iniciar sesion)" required><br><br></div><div class="form-group"><input type="text" id="reg-whatsapp" placeholder="WhatsApp (ej: 17871234567)"></div><div class="form-group"><select id="reg-municipio"><option value="">Selecciona tu municipio</option></select></div><div class="form-group"><select id="reg-categoria"><option value="">Selecciona tu servicio principal</option></select></div><div class="form-group"><textarea id="reg-bio" placeholder="Describe tu experiencia..." rows="3"></textarea></div><button class="btn-submit" onclick="registrarTecnico()">Registrarme Gratis</button><button class="btn-cancel" onclick="hideRegister()">Cancelar</button><p id="reg-message"></p></div></div></main><footer><p>ChambeaPR 2024 - Conectando Puerto Rico</p></footer><script>const API="/api";async function init(){const r1=await fetch(API+"/municipios");const d1=await r1.json();["filtro-municipio","reg-municipio"].forEach(id=>{const sel=document.getElementById(id);d1.municipios.forEach(m=>{const opt=document.createElement("option");opt.value=m;opt.textContent=m;sel.appendChild(opt);});});const r2=await fetch(API+"/categorias");const d2=await r2.json();["filtro-categoria","reg-categoria"].forEach(id=>{const sel=document.getElementById(id);d2.categorias.forEach(c=>{const opt=document.createElement("option");opt.value=c;opt.textContent=c;sel.appendChild(opt);});});buscarTecnicos();}async function buscarTecnicos(){const mun=document.getElementById("filtro-municipio").value;const cat=document.getElementById("filtro-categoria").value;let url=API+"/workers?";if(mun)url+="municipality="+mun+"&";if(cat)url+="category="+encodeURIComponent(cat);const res=await fetch(url);const workers=await res.json();const list=document.getElementById("workers-list");document.getElementById("total-count").textContent="("+workers.length+")";if(workers.length===0){list.innerHTML="<p style='text-align:center;padding:20px;color:#666'>No hay tecnicos en esta area todavia.</p>";return;}list.innerHTML=workers.map(w=>{const cats=w.categories.split(",").map(c=>"<span class='cat-badge'>"+c+"</span>").join("");return'<div class="worker-card"><div class="worker-info"><div class="worker-name">'+w.name+'</div><div class="worker-municipality">📍 '+w.municipality+'</div><div class="worker-cats">'+cats+'</div><div class="worker-bio">'+( w.bio||"")+'</div></div><div class="worker-actions"><a href="https://wa.me/'+( w.whatsapp||"")+'" target="_blank" class="btn-whatsapp">WhatsApp</a></div></div>';}).join("");}function showRegister(){document.getElementById("register-modal").classList.remove("hidden");}function hideRegister(){document.getElementById("register-modal").classList.add("hidden");}async function registrarTecnico(){const name=document.getElementById("reg-name").value;const email=document.getElementById("reg-email").value;const whatsapp=document.getElementById("reg-whatsapp").value;const municipality=document.getElementById("reg-municipio").value;const categories=document.getElementById("reg-categoria").value;const bio=document.getElementById("reg-bio").value;const msg=document.getElementById("reg-message");if(!name||!municipality||!categories){msg.textContent="Por favor completa todos los campos requeridos.";msg.className="error";return;}const res=await fetch(API+"/workers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,phone,whatsapp,municipality,categories,bio})});if(res.ok){msg.textContent="Registro exitoso!";msg.className="success";}else{msg.textContent="Error al registrar.";msg.className="error";}}document.addEventListener("DOMContentLoaded",init);</script></body></html>
