<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChambeaPR - Restablecer Contrasena</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:"Segoe UI",sans-serif;background:#f0f2f5;color:#1B2A4A;display:flex;flex-direction:column;min-height:100vh;}header{background:linear-gradient(135deg,#1B2A4A,#2C3E6B);padding:20px;text-align:center;}header h1{color:#F5A623;font-size:1.5em;}main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}.card{background:white;border-radius:12px;padding:30px;width:100%;max-width:400px;box-shadow:0 2px 8px rgba(27,42,74,0.1);border-top:4px solid #F5A623;}.card h2{color:#1B2A4A;margin-bottom:8px;}.card p{color:#666;font-size:0.9em;margin-bottom:20px;}.form-group{margin-bottom:15px;}.form-group label{display:block;color:#1B2A4A;font-weight:bold;font-size:0.9em;margin-bottom:5px;}.form-group input{width:100%;padding:12px;border:2px solid #dde3f0;border-radius:10px;font-size:1em;}.form-group input:focus{border-color:#F5A623;outline:none;}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1em;cursor:pointer;font-weight:bold;margin-bottom:10px;}.btn-gold{background:#F5A623;color:#1B2A4A;}.message{padding:12px;border-radius:8px;margin-top:10px;text-align:center;font-size:0.9em;display:none;}.success{background:#fff3cd;color:#1B2A4A;border:1px solid #F5A623;}.error{background:#ffe0e0;color:#c1121f;}footer{text-align:center;padding:20px;background:#1B2A4A;color:#ccd6f6;}footer strong{color:#F5A623;}</style></head><body><header><h1>🔨 ChambeaPR</h1></header><main><div class="card"><h2>Nueva Contrasena</h2><p>Ingresa tu nueva contrasena.</p><div class="form-group"><label>Nueva Contrasena</label><input type="password" id="new-password" placeholder="Nueva contrasena"></div><div class="form-group"><label>Confirmar Contrasena</label><input type="password" id="confirm-password" placeholder="Confirma tu contrasena"></div><button class="btn btn-gold" onclick="resetPassword()">Guardar Nueva Contrasena</button><p id="reset-msg" class="message"></p></div></main><footer><strong>ChambeaPR</strong> - Conectando Puerto Rico 🇵🇷</footer><script>const API="/api";const token=new URLSearchParams(window.location.search).get("token");if(!token){document.querySelector(".card").innerHTML="<h2 style='color:#c1121f;'>Enlace invalido</h2><p>Este enlace no es valido o ha expirado.</p><a href='/forgot-password' style='color:#1B2A4A;font-weight:bold;'>Solicitar nuevo enlace</a>";}async function resetPassword(){const password=document.getElementById("new-password").value;const confirm=document.getElementById("confirm-password").value;const msg=document.getElementById("reset-msg");if(!password||!confirm){msg.textContent="Por favor completa todos los campos.";msg.className="message error";msg.style.display="block";return;}if(password!==confirm){msg.textContent="Las contrasenas no coinciden.";msg.className="message error";msg.style.display="block";return;}if(password.length<6){msg.textContent="La contrasena debe tener al menos 6 caracteres.";msg.className="message error";msg.style.display="block";return;}const res=await fetch(API+"/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});if(res.ok){msg.textContent="Contrasena actualizada! Redirigiendo...";msg.className="message success";msg.style.display="block";setTimeout(()=>window.location.href="/dashboard",2000);}else{msg.textContent="Enlace invalido o expirado.";msg.className="message error";msg.style.display="block";}}</script></body></html>
