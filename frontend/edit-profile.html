<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChambeaPR - Editar Perfil</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:"Segoe UI",sans-serif;background:#f0f2f5;color:#1B2A4A;}header{background:linear-gradient(135deg,#1B2A4A,#2C3E6B);padding:20px;text-align:center;}header h1{color:#F5A623;font-size:1.5em;}main{max-width:600px;margin:30px auto;padding:20px;}.card{background:white;border-radius:12px;padding:25px;margin-bottom:20px;box-shadow:0 2px 8px rgba(27,42,74,0.1);border-top:4px solid #F5A623;}.card h2{color:#1B2A4A;margin-bottom:20px;font-size:1.1em;border-left:4px solid #F5A623;padding-left:10px;}.form-group{margin-bottom:15px;}.form-group label{display:block;color:#1B2A4A;font-weight:bold;font-size:0.9em;margin-bottom:5px;}.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid #dde3f0;border-radius:10px;font-size:1em;color:#1B2A4A;}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#F5A623;outline:none;}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1em;cursor:pointer;font-weight:bold;margin-bottom:10px;}.btn-gold{background:#F5A623;color:#1B2A4A;}.btn-navy{background:#1B2A4A;color:white;}.message{padding:12px;border-radius:8px;margin-top:10px;text-align:center;}.success{background:#fff3cd;color:#1B2A4A;border:1px solid #F5A623;}.error{background:#ffe0e0;color:#c1121f;}footer{text-align:center;padding:20px;background:#1B2A4A;color:#ccd6f6;margin-top:30px;}footer strong{color:#F5A623;}</style></head><body><header><h1>🔨 Editar Mi Perfil</h1></header><main><div id="login-section"><div class="card"><h2>Verifica tu identidad</h2><div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="tu@email.com"></div><div class="form-group"><label>Contrasena</label><input type="password" id="login-password" placeholder="Tu contrasena"></div><button class="btn btn-gold" onclick="verificar()">Continuar</button><p id="login-msg" class="message" style="display:none;"></p></div></div><div id="edit-section" style="display:none;"><div class="card"><h2>Editar Perfil</h2><div class="form-group"><label>Nombre Completo</label><input type="text" id="edit-name" placeholder="Tu nombre completo"></div><div class="form-group"><label>Servicio Principal</label><select id="edit-profession"></select></div><div class="form-group"><label>Municipio</label><select id="edit-municipality"></select></div><div class="form-group"><label>Descripcion</label><textarea id="edit-description" rows="4" placeholder="Describe tu experiencia..."></textarea></div><div class="form-group"><label>Numero de WhatsApp</label><input type="text" id="edit-whatsapp" placeholder="17871234567"></div><div class="form-group"><label>Numero de Licencia (opcional)</label><input type="text" id="edit-license" placeholder="Ej: Perito Electricista #12345"></div><button class="btn btn-gold" onclick="guardarCambios()">Guardar Cambios</button><button class="btn btn-navy" onclick="window.location.href='/dashboard'">Volver al Dashboard</button><p id="edit-msg" class="message" style="display:none;"></p></div></div></main><footer><strong>ChambeaPR</strong> - Conectando Puerto Rico 🇵🇷</footer><script>const API="/api";let workerEmail="";async function verificar(){const email=document.getElementById("login-email").value;const password=document.getElementById("login-password").value;const msg=document.getElementById("login-msg");if(!email||!password){msg.textContent="Por favor completa todos los campos.";msg.className="message error";msg.style.display="block";return;}const res=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});if(!res.ok){msg.textContent="Email o contrasena incorrectos.";msg.className="message error";msg.style.display="block";return;}workerEmail=email;const wRes=await fetch(API+"/workers/by-email/"+encodeURIComponent(email));const w=await wRes.json();document.getElementById("login-section").style.display="none";document.getElementById("edit-section").style.display="block";await cargarOpciones();document.getElementById("edit-name").value=w.full_name||"";document.getElementById("edit-description").value=w.description||"";document.getElementById("edit-whatsapp").value=w.whatsapp_number||"";document.getElementById("edit-license").value=w.license_number||"";}async function cargarOpciones(){const r1=await fetch(API+"/municipios");const d1=await r1.json();const selM=document.getElementById("edit-municipality");d1.municipios.forEach(m=>{const opt=document.createElement("option");opt.value=m;opt.textContent=m;selM.appendChild(opt);});const r2=await fetch(API+"/categorias");const d2=await r2.json();const selP=document.getElementById("edit-profession");d2.categorias.forEach(c=>{const opt=document.createElement("option");opt.value=c;opt.textContent=c;selP.appendChild(opt);});}async function guardarCambios(){const msg=document.getElementById("edit-msg");const data={full_name:document.getElementById("edit-name").value,profession:document.getElementById("edit-profession").value,municipality:document.getElementById("edit-municipality").value,description:document.getElementById("edit-description").value,whatsapp_number:document.getElementById("edit-whatsapp").value,license_number:document.getElementById("edit-license").value};const res=await fetch(API+"/workers/update/"+encodeURIComponent(workerEmail),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});if(res.ok){msg.textContent="Perfil actualizado exitosamente!";msg.className="message success";msg.style.display="block";setTimeout(()=>window.location.href="/dashboard",2000);}else{msg.textContent="Error al actualizar. Intenta de nuevo.";msg.className="message error";msg.style.display="block";}}</script></body></html>
