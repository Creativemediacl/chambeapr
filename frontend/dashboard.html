<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChambeaPR - Mi Perfil</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:"Segoe UI",sans-serif;background:#f0f2f5;color:#1B2A4A;}header{background:linear-gradient(135deg,#1B2A4A,#2C3E6B);padding:20px;text-align:center;}header h1{color:#F5A623;font-size:1.5em;}main{max-width:600px;margin:30px auto;padding:20px;}.card{background:white;border-radius:12px;padding:25px;margin-bottom:20px;box-shadow:0 2px 8px rgba(27,42,74,0.1);border-top:4px solid #F5A623;}.card h2{color:#1B2A4A;margin-bottom:15px;font-size:1.1em;border-left:4px solid #F5A623;padding-left:10px;}.trial-banner{background:#fff3cd;border:2px solid #F5A623;border-radius:10px;padding:15px;margin-bottom:20px;text-align:center;}.trial-banner h3{color:#1B2A4A;margin-bottom:5px;}.trial-banner p{color:#555;font-size:0.9em;}.trial-days{font-size:2.5em;font-weight:800;color:#F5A623;}.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f2f5;font-size:0.95em;}.info-row:last-child{border-bottom:none;}.info-label{color:#666;font-weight:600;}.info-value{color:#1B2A4A;font-weight:500;}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1em;cursor:pointer;font-weight:bold;margin-bottom:10px;}.btn-gold{background:#F5A623;color:#1B2A4A;}.btn-navy{background:#1B2A4A;color:white;}.btn-red{background:#ffe0e0;color:#c1121f;border:2px solid #c1121f;}.login-box{background:white;border-radius:12px;padding:30px;box-shadow:0 2px 8px rgba(27,42,74,0.1);}.login-box h2{color:#1B2A4A;margin-bottom:5px;}.login-box p{color:#666;font-size:0.9em;margin-bottom:20px;}.form-group{margin-bottom:15px;}.form-group label{display:block;color:#1B2A4A;font-weight:bold;font-size:0.9em;margin-bottom:5px;}.form-group input{width:100%;padding:12px;border:2px solid #dde3f0;border-radius:10px;font-size:1em;}.message{padding:12px;border-radius:8px;margin-top:10px;text-align:center;font-size:0.9em;}.success{background:#fff3cd;color:#1B2A4A;border:1px solid #F5A623;}.error{background:#ffe0e0;color:#c1121f;}footer{text-align:center;padding:20px;background:#1B2A4A;color:#ccd6f6;margin-top:30px;}footer strong{color:#F5A623;}</style></head><body><header><h1>🔨 ChambeaPR - Mi Perfil</h1></header><main><div id="login-section"><div class="login-box"><h2>Accede a tu perfil</h2><p>Ingresa tu email para ver y gestionar tu perfil</p><div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="tu@email.com"></div><div class="form-group"><label>Contrasena</label><input type="password" id="login-password" placeholder="Tu contrasena"></div><button class="btn btn-gold" onclick="buscarPerfil()">Entrar</button><p style="text-align:center;margin-top:10px;"><a href="/forgot-password" style="color:#1B2A4A;font-size:0.9em;">Olvidaste tu contrasena?</a></p><p id="login-message" class="message" style="display:none;"></p></div></div><div id="profile-section" style="display:none;"><div class="trial-banner" id="trial-banner"></div><div class="card"><h2>Mi Informacion</h2><div id="profile-info"></div></div><div class="card"><h2>Acciones</h2><button class="btn btn-gold" onclick="window.location.href='/subscribe'">Suscribirme - $9.99/mes</button><button class="btn btn-navy" onclick="window.location.href='/edit-profile'">Editar Perfil</button><button class="btn btn-navy" onclick="window.location.href='/'">Ver App</button><button class="btn btn-red" onclick="desactivarCuenta()">Desactivar Mi Cuenta</button></div></div></main><footer><p><strong>ChambeaPR</strong> - Conectando Puerto Rico 🇵🇷</p></footer><script>const API="/api";async function buscarPerfil(){const email=document.getElementById("login-email").value;const password=document.getElementById("login-password").value;sessionStorage.setItem("chambea_email",email);const msg=document.getElementById("login-message");if(!email||!password){msg.textContent="Por favor ingresa tu email y contrasena.";msg.className="message error";msg.style.display="block";return;}const loginRes=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});if(!loginRes.ok){msg.textContent="Email o contrasena incorrectos.";msg.className="message error";msg.style.display="block";return;}const res=await fetch(API+"/workers/by-email/"+encodeURIComponent(email));if(!res.ok){msg.textContent="No encontramos un perfil con ese email.";msg.className="message error";msg.style.display="block";return;}const w=await res.json();document.getElementById("login-section").style.display="none";document.getElementById("profile-section").style.display="block";const trialDays=w.trial_ends_at?Math.max(0,Math.floor((new Date(w.trial_ends_at)-new Date())/86400000)):0;const banner=document.getElementById("trial-banner");if(trialDays>0){banner.innerHTML="<h3>Periodo de Prueba Gratuita</h3><div class='trial-days'>"+trialDays+"</div><p>dias restantes de tu prueba gratis</p><p style='margin-top:8px;font-size:0.85em;'>Tu prueba termina el "+new Date(w.trial_ends_at).toLocaleDateString("es-PR")+"</p>";}else{banner.innerHTML="<h3 style='color:#c1121f;'>Tu prueba gratuita ha terminado</h3><p>Suscribete para mantener tu perfil activo</p>";banner.style.borderColor="#c1121f";}document.getElementById("profile-info").innerHTML="<div class='info-row'><span class='info-label'>Nombre</span><span class='info-value'>"+w.full_name+"</span></div><div class='info-row'><span class='info-label'>Servicio</span><span class='info-value'>"+w.profession+"</span></div><div class='info-row'><span class='info-label'>Municipio</span><span class='info-value'>"+w.municipality+"</span></div><div class='info-row'><span class='info-label'>Email</span><span class='info-value'>"+w.email+"</span></div><div class='info-row'><span class='info-label'>Estado</span><span class='info-value'>"+(w.is_active?"Activo":"Inactivo")+"</span></div><div class='info-row'><span class='info-label'>Verificado</span><span class='info-value'>"+(w.is_verified?"Si ✓":"Pendiente")+"</span></div>";}async function desactivarCuenta(){if(!confirm("Estas seguro que deseas desactivar tu cuenta? Tu perfil no sera visible para los clientes."))return;const email=document.getElementById("login-email").value;const res=await fetch(API+"/workers/deactivate/"+encodeURIComponent(email),{method:"POST"});if(res.ok){alert("Tu cuenta ha sido desactivada. Puedes reactivarla en cualquier momento contactando a chambeaproficial@gmail.com");window.location.href="/";}else{alert("Error al desactivar. Contacta chambeaproficial@gmail.com");}};</script></body></html>
